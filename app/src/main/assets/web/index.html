<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Postscribe files</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Postscribe files</h1>
            <nav id="crumbs" class="crumbs"></nav>
        </div>
    </header>

    <main class="container">
        <section class="listing card">
            <header class="listing-head">
                <span class="col-name">Name</span>
                <span class="col-size">Size</span>
                <span class="col-actions"></span>
            </header>
            <ul id="entries" class="entries"></ul>
            <p id="empty" class="empty" hidden>This folder is empty.</p>
        </section>

        <section class="upload card">
            <h2>Upload to <code id="here"></code></h2>
            <form id="upload-form">
                <label class="dropzone" id="dropzone">
                    <input id="file-input" type="file" multiple>
                    <span class="dropzone-text">Choose files or drop here</span>
                </label>
                <ul id="queue" class="queue"></ul>
                <button id="upload-btn" type="submit" disabled>Upload</button>
            </form>
        </section>
    </main>

    <div id="toast" class="toast" hidden></div>

    <footer class="container">
        <p>by <a href="https://github.com/v4rgas/Postscribe" target="_blank" rel="noopener">v4rgas</a></p>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
